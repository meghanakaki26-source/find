 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lost & Found Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<!-- ================= LOGIN PAGE ================= -->

<div id="loginPage" class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        🔎 Lost & Found
                    </h2>

                    <input type="text"
                           id="username"
                           class="form-control mb-3"
                           placeholder="Username">

                    <input type="password"
                           id="password"
                           class="form-control mb-3"
                           placeholder="Password">

                    <button class="btn btn-primary w-100"
                            onclick="login()">
                        Login
                    </button>

                    <p id="loginMessage"
                       class="text-danger text-center mt-3"></p>

                </div>

            </div>

        </div>

    </div>

</div>


<!- ================= MAIN APPLICATION ================= -->

<div id="appPage" class="d-none">

    <!- Navbar -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <span class="navbar-brand">
                🔎 Lost & Found System
            </span>

            <button class="btn btn-light"
                    onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <div class="container mt-4">

        <!- Dashboard -->

        <h3 class="mb-4">Dashboard</h3>

        <div class="row g-3">

            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h6>Lost Items</h6>
                        <h2 id="lostCount">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h6>Found Items</h6>
                        <h2 id="foundCount">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h6>Returned Items</h6>
                        <h2 id="returnedCount">0</h2>
                    </div>
                </div>
            </div>

        </div>


        <!- Report Forms -->

        <div class="row mt-5">

            <!-- Lost Item -->

           <div class="col-md-6">

                <div class="card shadow-sm">

                    <div class="card-header bg-danger text-white">
                        Report Lost Item
                    </div>

                    <div class="card-body">

                        <input type="text"
                               id="lostName"
                               class="form-control mb-2"
                               placeholder="Item Name">

                        <select id="lostCategory"
                                class="form-select mb-2">

                            <option value="">Select Category</option>
                            <option>Mobile</option>
                            <option>Wallet</option>
                            <option>ID Card</option>
                            <option>Bag</option>
                            <option>Books</option>
                            <option>Keys</option>
                            <option>Other</option>

                        </select>

                        <input type="text"
                               id="lostLocation"
                               class="form-control mb-2"
                               placeholder="Lost Location">

                        <input type="date"
                               id="lostDate"
                               class="form-control mb-2">
                               

                        <textarea id="lostDescription"
                                  class="form-control mb-2"
                                  placeholder="Description"></textarea>

                        <input type="text"
                               id="lostContact"
                               class="form-control mb-3"
                               placeholder="Contact Information">

                        <button class="btn btn-danger w-100"
                                onclick="reportLost()">
                            Submit Lost Report
                        </button>

                    </div>

                </div>

            </div>


            <!-- Found Item -->

            <div class="col-md-6">

                <div class="card shadow-sm">

                    <div class="card-header bg-success text-white">
                        Report Found Item
                    </div>

                    <div class="card-body">

                        <input type="text"
                               id="foundName"
                               class="form-control mb-2"
                               placeholder="Item Name">

                        <select id="foundCategory"
                                class="form-select mb-2">

                            <option value="">Select Category</option>
                            <option>Mobile</option>
                            <option>Wallet</option>
                            <option>ID Card</option>
                            <option>Bag</option>
                            <option>Books</option>
                            <option>Keys</option>
                            <option>Other</option>

                        </select>

                        <input type="text"
                               id="foundLocation"
                               class="form-control mb-2"
                               placeholder="Found Location">

                        <input type="date"
                               id="foundDate"
                               class="form-control mb-2">

                        <textarea id="foundDescription"
                                  class="form-control mb-2"
                                  placeholder="Description"></textarea>

                        <input type="text"
                               id="foundContact"
                               class="form-control mb-3"
                               placeholder="Contact Information">

                        <button class="btn btn-success w-100"
                                onclick="reportFound()">
                            Submit Found Report
                        </button>

                    </div>

                </div>

            </div>

        </div>


        <!-- Search -->

        <div class="card shadow-sm mt-5">

            <div class="card-body">

                <h4>🔍 Search Items</h4>

                <input type="text"
                       id="searchInput"
                       class="form-control mb-3"
                       placeholder="Search by item name..."
                       onkeyup="searchItems()">

                <div id="itemsList"></div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Our JavaScript -->

<script src="script.js"></script>

</body>
</html>
